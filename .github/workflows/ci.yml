name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - run: swift build
      - run: swift test

  linux:
    runs-on: ubuntu-24.04
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@v5
      - run: swift build
      - run: swift test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE
      - run: swift build

  # Runs install.ps1 against fake release assets served from file:// URLs, so the installer's
  # download, checksum, extract, and install logic is tested on every change, under sh and
  # both PowerShell editions, without needing a published release.
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, shell: sh }
          - { runner: macos-15, shell: sh }
          - { runner: windows-latest, shell: pwsh }
          - { runner: windows-latest, shell: powershell }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Test the installer under sh
        if: matrix.shell == 'sh'
        run: sh Scripts/test-installer.sh
      - name: Test the installer under PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./Scripts/test-installer.ps1
      - name: Test the installer under Windows PowerShell 5.1
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./Scripts/test-installer.ps1
