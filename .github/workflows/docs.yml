name: docs

# Builds BouncerCore's DocC documentation (API reference plus the usage
# articles under Sources/BouncerCore/BouncerCore.docc/Articles) and deploys
# it to GitHub Pages. Runs on every push to main, and can be triggered by
# hand from the Actions tab.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Generate DocC archive
        run: |
          swift package --allow-writing-to-directory ./docs \
            generate-documentation --target BouncerCore \
            --output-path ./docs \
            --transform-for-static-hosting \
            --hosting-base-path bouncer
      - name: Redirect the site root to the module's landing page
        # DocC has no page at the root, so its app would show "page not found" there.
        run: |
          cat > ./docs/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Bouncer documentation</title>
          <meta http-equiv="refresh" content="0; url=documentation/bouncercore/">
          <link rel="canonical" href="documentation/bouncercore/">
          <a href="documentation/bouncercore/">Bouncer documentation</a>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
