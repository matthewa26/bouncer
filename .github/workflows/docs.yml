name: docs

# Builds the GitHub Pages site and deploys it: BouncerCore's DocC
# documentation (API reference plus the usage articles under
# Sources/BouncerCore/BouncerCore.docc/Articles), the installer at
# /install.ps1, and the latest release's archives and SHA256SUMS under
# /download/latest/, which the installer downloads from by default. A deploy
# replaces the whole site, so this is the only workflow that deploys it. Runs
# on every push to main, and release.yml runs it after publishing a release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Generate DocC archive
        run: |
          swift package --allow-writing-to-directory ./docs \
            generate-documentation --target BouncerCore \
            --output-path ./docs \
            --transform-for-static-hosting \
            --hosting-base-path bouncer
      - name: Add the landing page at the site root
        # DocC has no page at the root; Site/ holds the landing page and its logo.
        run: cp -R Site/. ./docs/
      - name: Add the installer and the latest release's downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.ps1 ./docs/install.ps1
          if gh release view --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download --repo "$GITHUB_REPOSITORY" --dir ./docs/download/latest \
              --pattern 'bouncer-*' --pattern SHA256SUMS
            (cd ./docs/download/latest && shasum -a 256 -c SHA256SUMS)
          else
            echo "No release yet; the site has no downloads."
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
