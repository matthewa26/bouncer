name: release

# Builds release artifacts for a tagged version, each runnable without Swift installed:
# - macOS: one universal (arm64 + x86_64) binary.
# - Linux: fully static musl binaries for x86_64 and arm64, built with the Static Linux SDK,
#   so they run on any distro and under WSL1/WSL2.
# - Windows: an x86_64 zip of bouncer.exe plus the Swift runtime DLLs it loads.
# Plus SHA256SUMS, which install.ps1 verifies every download against.
#
# The Swift version is pinned so the Static Linux SDK matches its toolchain exactly; bump
# SWIFT_VERSION and STATIC_SDK_CHECKSUM together (checksums are listed at swift.org/install).

on:
  push:
    tags:
      - "v*"

env:
  SWIFT_VERSION: "6.4.2"
  STATIC_SDK_CHECKSUM: "3786b179936d9cc9e266dd506bd1654176358d7b25288e243359f4d17cc4dc5a"

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift build -c release --arch arm64 --arch x86_64
      - name: Package
        run: |
          bin="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/bouncer"
          lipo -archs "$bin" | grep -q x86_64 && lipo -archs "$bin" | grep -q arm64
          "$bin" --version
          mkdir -p dist
          tar -czf dist/bouncer-macos-universal.tar.gz -C "$(dirname "$bin")" bouncer
      - uses: actions/upload-artifact@v4
        with:
          name: bouncer-macos-universal
          path: dist/*

  linux:
    runs-on: ubuntu-24.04
    # Job containers can't read env, so this tag repeats SWIFT_VERSION; keep them in sync.
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@v5
      - name: Install the Static Linux SDK
        run: |
          release="swift-${SWIFT_VERSION}-RELEASE"
          url="https://download.swift.org/swift-${SWIFT_VERSION}-release/static-sdk/${release}"
          swift sdk install "${url}/${release}_static-linux-0.1.0.artifactbundle.tar.gz" \
            --checksum "$STATIC_SDK_CHECKSUM"
      - name: Build and package both architectures
        run: |
          mkdir -p dist
          for pair in x86_64:x86_64 aarch64:arm64; do
            triple="${pair%%:*}-swift-linux-musl"
            swift build -c release --swift-sdk "$triple"
            bin="$(swift build -c release --swift-sdk "$triple" --show-bin-path)"
            # Debug info triples the size; llvm-objcopy strips either architecture from this host.
            llvm-objcopy --strip-all "$bin/bouncer"
            tar -czf "dist/bouncer-linux-${pair##*:}.tar.gz" -C "$bin" bouncer
          done
          "$(swift build -c release --swift-sdk x86_64-swift-linux-musl --show-bin-path)/bouncer" --version
      - uses: actions/upload-artifact@v4
        with:
          name: bouncer-linux
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-release
          swift-build: ${{ env.SWIFT_VERSION }}-RELEASE
      - name: Build and package with the Swift runtime
        shell: pwsh
        run: ./Scripts/package-windows.ps1 -Output dist/bouncer-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: bouncer-windows-x86_64
          path: dist/*

  publish:
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum bouncer-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*

  # Puts this release on the Pages site, which the installer downloads from by default. The
  # site is deployed only by docs.yml, from main (Pages refuses deploys from a tag), so this
  # starts that workflow and waits for it to finish.
  site:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Rebuild the site with this release
        run: |
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main
          for attempt in $(seq 30); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow docs.yml --event workflow_dispatch \
              --json databaseId,createdAt --jq "map(select(.createdAt >= \"$started\"))[0].databaseId // empty")
            [ -n "$run" ] && break
            sleep 5
          done
          [ -n "$run" ] || { echo "docs.yml didn't start"; exit 1; }
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status
      - name: Wait until the site serves this release
        # Pages sits behind a CDN that can serve the previous files for a few minutes.
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir expected
          site="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          for attempt in $(seq 40); do
            if curl -fsSL "$site/download/latest/SHA256SUMS?attempt=$attempt" | cmp -s - expected/SHA256SUMS; then
              echo "The site serves $GITHUB_REF_NAME."; exit 0
            fi
            sleep 15
          done
          echo "The site still doesn't serve $GITHUB_REF_NAME after 10 minutes."; exit 1

  # Installs the release that was just published, the way a user would (from the Pages site), on
  # every supported platform, and checks it reports this tag's version. Old-glibc and musl
  # containers prove the Linux binary is fully static.
  smoke-test:
    needs: site
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, shell: sh }
          - { runner: ubuntu-24.04-arm, shell: sh }
          - { runner: ubuntu-24.04, shell: sh, container: "ubuntu:20.04" }
          - { runner: ubuntu-24.04, shell: sh, container: "alpine:3" }
          - { runner: macos-15, shell: sh }
          - { runner: macos-15-intel, shell: sh }
          - { runner: windows-latest, shell: pwsh }
          - { runner: windows-latest, shell: powershell }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      INSTALLER_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/install.ps1
      BOUNCER_REPO: ${{ github.repository }}
      EXPECTED_VERSION: ${{ github.ref_name }}
    steps:
      - name: Install curl in bare containers
        if: matrix.container
        run: |
          if command -v apk >/dev/null; then apk add --no-cache curl
          else apt-get update -qq && apt-get install -y -qq curl ca-certificates; fi
      - name: Install with sh
        if: matrix.shell == 'sh'
        run: |
          curl -fsSL "$INSTALLER_URL" | sh
          "$HOME/.local/bin/bouncer" --version | tee version.txt
          grep -qF "${EXPECTED_VERSION#v}" version.txt
      - name: Install with PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          irm $env:INSTALLER_URL | iex
          $version = & "$env:LOCALAPPDATA\Programs\bouncer\bouncer.exe" --version
          $version
          if ($version -notmatch [regex]::Escape($env:EXPECTED_VERSION.TrimStart('v'))) { exit 1 }
      - name: Install with PowerShell 5.1
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          irm $env:INSTALLER_URL | iex
          $version = & "$env:LOCALAPPDATA\Programs\bouncer\bouncer.exe" --version
          $version
          if ($version -notmatch [regex]::Escape($env:EXPECTED_VERSION.TrimStart('v'))) { exit 1 }
