name: release

# Builds release artifacts for a tagged version, each runnable without Swift installed:
# - macOS: one universal (arm64 + x86_64) binary.
# - Linux: fully static musl binaries for x86_64 and arm64, built with the Static Linux SDK,
#   so they run on any distro and under WSL1/WSL2.
# - Windows: an x86_64 zip of bouncer.exe plus the Swift runtime DLLs it loads.
# - SwiftPM: bouncer.artifactbundle.zip, the macOS and Linux binaries as one binary artifact for the
#   bouncer-plugin package (github.com/matthewa26/bouncer-plugin), whose Package.swift pins its URL and checksum;
#   the plugin job bumps and tags it.
# Plus SHA256SUMS, which install.ps1 verifies every download against. The homebrew job then
# publishes Formula/bouncer.rb to github.com/matthewa26/homebrew-tap.
#
# The Swift version is pinned so the Static Linux SDK matches its toolchain exactly; bump
# SWIFT_VERSION and STATIC_SDK_CHECKSUM together (checksums are listed at swift.org/install).

on:
  push:
    tags:
      - "v*"

env:
  SWIFT_VERSION: "6.4.2"
  STATIC_SDK_CHECKSUM: "3786b179936d9cc9e266dd506bd1654176358d7b25288e243359f4d17cc4dc5a"

jobs:
  # Fails the release before anything builds if ReleaseNotes/<version>.md is missing; publish uses it as the
  # release description.
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh Scripts/check-release-notes.sh "${GITHUB_REF_NAME#v}"

  macos:
    needs: notes
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Stamp the version
        run: sh Scripts/generate-version.sh "${GITHUB_REF_NAME#v}"
      - run: swift build -c release --arch arm64 --arch x86_64
      - name: Package
        run: |
          bin="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/bouncer"
          lipo -archs "$bin" | grep -q x86_64 && lipo -archs "$bin" | grep -q arm64
          "$bin" --version
          mkdir -p dist man
          sh Scripts/generate-manual.sh man
          cp "$bin" man/bouncer
          tar -czf dist/bouncer-macos-universal.tar.gz -C man bouncer bouncer.1
      - uses: actions/upload-artifact@v7
        with:
          name: bouncer-macos-universal
          path: dist/*

  linux:
    needs: notes
    runs-on: ubuntu-24.04
    # Job containers can't read env, so this tag repeats SWIFT_VERSION; keep them in sync.
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@v7
      - name: Install the Static Linux SDK
        run: |
          release="swift-${SWIFT_VERSION}-RELEASE"
          url="https://download.swift.org/swift-${SWIFT_VERSION}-release/static-sdk/${release}"
          swift sdk install "${url}/${release}_static-linux-0.1.0.artifactbundle.tar.gz" \
            --checksum "$STATIC_SDK_CHECKSUM"
      - name: Stamp the version
        run: sh Scripts/generate-version.sh "${GITHUB_REF_NAME#v}"
      - name: Build and package both architectures
        run: |
          mkdir -p dist man
          sh Scripts/generate-manual.sh man
          for pair in x86_64:x86_64 aarch64:arm64; do
            triple="${pair%%:*}-swift-linux-musl"
            swift build -c release --swift-sdk "$triple"
            bin="$(swift build -c release --swift-sdk "$triple" --show-bin-path)"
            # Debug info triples the size; llvm-objcopy strips either architecture from this host.
            llvm-objcopy --strip-all "$bin/bouncer"
            cp man/bouncer.1 "$bin/"
            tar -czf "dist/bouncer-linux-${pair##*:}.tar.gz" -C "$bin" bouncer bouncer.1
          done
          "$(swift build -c release --swift-sdk x86_64-swift-linux-musl --show-bin-path)/bouncer" --version
      - uses: actions/upload-artifact@v7
        with:
          name: bouncer-linux
          path: dist/*

  windows:
    needs: notes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-release
          swift-build: ${{ env.SWIFT_VERSION }}-RELEASE
      - name: Stamp the version
        shell: bash
        run: sh Scripts/generate-version.sh "${GITHUB_REF_NAME#v}"
      - name: Build and package with the Swift runtime
        shell: pwsh
        run: ./Scripts/package-windows.ps1 -Output dist/bouncer-windows-x86_64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: bouncer-windows-x86_64
          path: dist/*

  publish:
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v7
        with:
          path: source
      - name: Build the SwiftPM artifact bundle
        run: |
          for archive in macos-universal linux-x86_64 linux-arm64; do
            mkdir -p "bin/$archive"
            tar -xzf "dist/bouncer-$archive.tar.gz" -C "bin/$archive"
          done
          sh source/Scripts/make-artifactbundle.sh "$GITHUB_REF_NAME" bin/macos-universal/bouncer \
            bin/linux-x86_64/bouncer bin/linux-arm64/bouncer dist/bouncer.artifactbundle.zip
      - name: Write SHA256SUMS
        working-directory: dist
        # The installer looks up its own archive's line, so the bundle's extra line doesn't affect it.
        run: sha256sum bouncer-* bouncer.artifactbundle.zip > SHA256SUMS && cat SHA256SUMS
      - name: Name the release notes file
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          body_path: source/ReleaseNotes/${{ env.VERSION }}.md
  # Publishes the formula for this release to the Homebrew tap. Writing to another repo needs a token this
  # workflow's own doesn't have: HOMEBREW_TAP_TOKEN, a fine-grained token with Contents read and write on
  # the tap (and on bouncer-plugin, for the plugin job). Without it the job prints the formula instead, to commit by hand.
  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAP: ${{ github.repository_owner }}/homebrew-tap
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
      - name: Write the formula
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
          sh source/Scripts/make-homebrew-formula.sh "$GITHUB_REF_NAME" SHA256SUMS "$GITHUB_REPOSITORY" > bouncer.rb
          cat bouncer.rb
      - name: Push it to the tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP}.git" tap
          mkdir -p tap/Formula && cp bouncer.rb tap/Formula/bouncer.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/bouncer.rb
          git diff --cached --quiet && { echo "The tap already has this formula."; exit 0; }
          git commit -m "bouncer ${GITHUB_REF_NAME#v}"
          git push
      - name: Say how to publish it by hand
        if: env.TAP_TOKEN == ''
        run: |
          echo "### Homebrew formula not pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "HOMEBREW_TAP_TOKEN isn't set. Commit the formula printed above as Formula/bouncer.rb in $TAP." \
            >> "$GITHUB_STEP_SUMMARY"

  # Points bouncer-plugin's Package.swift at this release's artifact bundle and tags the plugin with the same
  # version, without the `v`, so `from:` requirements work. Uses the same token as the homebrew job, which
  # also needs Contents read and write on bouncer-plugin. Without it the job prints the two lines to change.
  plugin:
    needs: publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PLUGIN: ${{ github.repository_owner }}/bouncer-plugin
      PLUGIN_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Read the bundle's checksum
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
          checksum=$(grep ' \*\{0,1\}bouncer.artifactbundle.zip$' SHA256SUMS | cut -d ' ' -f 1)
          [ -n "$checksum" ] || { echo "SHA256SUMS has no bouncer.artifactbundle.zip"; exit 1; }
          echo "CHECKSUM=$checksum" >> "$GITHUB_ENV"
          {
            echo "### bouncer-plugin"
            echo '```swift'
            echo "let bouncerVersion = \"$GITHUB_REF_NAME\""
            echo "let bouncerChecksum = \"$checksum\""
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Bump and tag the plugin
        if: env.PLUGIN_TOKEN != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${PLUGIN_TOKEN}@github.com/${PLUGIN}.git" plugin
          cd plugin
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "bouncer-plugin already has tag $version."; exit 0
          fi
          sed -i "s/^let bouncerVersion = \".*\"/let bouncerVersion = \"$GITHUB_REF_NAME\"/" Package.swift
          sed -i "s/^let bouncerChecksum = \".*\"/let bouncerChecksum = \"$CHECKSUM\"/" Package.swift
          grep -qx "let bouncerVersion = \"$GITHUB_REF_NAME\"" Package.swift
          grep -qx "let bouncerChecksum = \"$CHECKSUM\"" Package.swift
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Use Bouncer $version"
          git tag -a "$version" -m "Bouncer plugin $version"
          git push origin HEAD "refs/tags/$version"
      - name: Say how to bump it by hand
        if: env.PLUGIN_TOKEN == ''
        run: |
          echo "HOMEBREW_TAP_TOKEN isn't set: set the two lines above in $PLUGIN's Package.swift, commit, and tag" \
            "${GITHUB_REF_NAME#v}." >> "$GITHUB_STEP_SUMMARY"

  # Puts this release on the Pages site, which the installer downloads from by default. The
  # site is deployed only by docs.yml, from main (Pages refuses deploys from a tag), so this
  # starts that workflow and waits for it to finish.
  site:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Rebuild the site with this release
        run: |
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main
          for attempt in $(seq 30); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow docs.yml --event workflow_dispatch \
              --json databaseId,createdAt --jq "map(select(.createdAt >= \"$started\"))[0].databaseId // empty")
            [ -n "$run" ] && break
            sleep 5
          done
          [ -n "$run" ] || { echo "docs.yml didn't start"; exit 1; }
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status
      - name: Wait until the site serves this release
        # Pages sits behind a CDN that can serve the previous files for a few minutes.
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir expected
          site="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          for attempt in $(seq 40); do
            if curl -fsSL "$site/download/latest/SHA256SUMS?attempt=$attempt" | cmp -s - expected/SHA256SUMS; then
              echo "The site serves $GITHUB_REF_NAME."; exit 0
            fi
            sleep 15
          done
          echo "The site still doesn't serve $GITHUB_REF_NAME after 10 minutes."; exit 1

  # Installs the release that was just published, the way a user would (from the Pages site), on
  # every supported platform, and checks it reports this tag's version. Old-glibc and musl
  # containers prove the Linux binary is fully static.
  smoke-test:
    needs: site
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, shell: sh }
          - { runner: ubuntu-24.04-arm, shell: sh }
          - { runner: ubuntu-24.04, shell: sh, container: "ubuntu:20.04" }
          - { runner: ubuntu-24.04, shell: sh, container: "alpine:3" }
          - { runner: macos-15, shell: sh }
          - { runner: macos-15-intel, shell: sh }
          - { runner: windows-latest, shell: pwsh }
          - { runner: windows-latest, shell: powershell }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      INSTALLER_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/install.ps1
      BOUNCER_REPO: ${{ github.repository }}
      EXPECTED_VERSION: ${{ github.ref_name }}
    steps:
      - name: Install curl in bare containers
        if: matrix.container
        run: |
          if command -v apk >/dev/null; then apk add --no-cache curl
          else apt-get update -qq && apt-get install -y -qq curl ca-certificates; fi
      - name: Install with sh
        if: matrix.shell == 'sh'
        run: |
          # bouncer:disable-next-line pipe-to-shell -- smoke-tests the published one-line installer
          curl -fsSL "$INSTALLER_URL" | sh
          "$HOME/.local/bin/bouncer" --version | tee version.txt
          grep -qF "${EXPECTED_VERSION#v}" version.txt
      - name: Install with PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          # bouncer:disable-next-line pipe-to-shell -- smoke-tests the published one-line installer
          irm $env:INSTALLER_URL | iex
          $version = & "$env:LOCALAPPDATA\Programs\bouncer\bouncer.exe" --version
          $version
          if ($version -notmatch [regex]::Escape($env:EXPECTED_VERSION.TrimStart('v'))) { exit 1 }
      - name: Install with PowerShell 5.1
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          # bouncer:disable-next-line pipe-to-shell -- smoke-tests the published one-line installer
          irm $env:INSTALLER_URL | iex
          $version = & "$env:LOCALAPPDATA\Programs\bouncer\bouncer.exe" --version
          $version
          if ($version -notmatch [regex]::Escape($env:EXPECTED_VERSION.TrimStart('v'))) { exit 1 }
